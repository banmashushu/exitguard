name: Native build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    strategy:
      # Report each platform independently; a Mac packaging failure must not
      # cancel the Windows race tests, vet and build.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The desktop build scripts refuse anything but the pinned go.mod version.
          go-version-file: go.mod
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: node internal/ui/frontend_test.cjs
      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: go build -trimpath -o dist/ExitGuard-windows-amd64.exe ./cmd/exitguard
      - name: Install pinned MyGo
        if: runner.os == 'macOS'
        run: go install github.com/egoist/mygo/cmd/mygo@v0.7.3
      - name: Build ordinary local Mac app
        if: runner.os == 'macOS'
        run: |
          EXITGUARD_GO="$(go env GOROOT)/bin/go" \
          EXITGUARD_MYGO="$(go env GOPATH)/bin/mygo" \
          sh scripts/build-local.sh
      - name: Compile unsigned filter sources and policy tests
        if: runner.os == 'macOS'
        run: sh platform/macos/filter-build.sh dist/native-macos
      - uses: actions/upload-artifact@v4
        with:
          name: ExitGuard-${{ runner.os }}
          path: dist/
          if-no-files-found: error
